<!doctype html>
<!--
Title: rock808s Node Takeover
Description: A strategy game where players take over nodes on a gameboard. The game includes walls that block paths, and nodes generate units over time.
Author: David Slimp - rock808@David-Slimp.com

-->
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>rock808's Node Takeover</title>
        <link rel="stylesheet" href="style.css?v=__APP_VERSION__" />
    </head>
    <body>
        <div id="app">
            <aside id="sidebar" aria-label="Game menu">
                <div class="brand">
                    <div class="brand-title">Node Takeover</div>
                    <div id="versionNumber" class="brand-version"></div>
                </div>

                <div id="gameHUD" class="panel">
                    <div id="statusText" class="hud-line"></div>

                    <div class="seed-field" id="seedField">
                        <label for="seedInput">Seed</label>
                        <input
                            id="seedInput"
                            type="number"
                            inputmode="numeric"
                        />
                    </div>

                    <button
                        id="restartButton"
                        class="btn btn-primary"
                        type="button"
                    >
                        Restart (R)
                    </button>

                    <button
                        id="settingsButton"
                        class="btn btn-secondary"
                        type="button"
                    >
                        <span class="btn-icon" aria-hidden="true">⚙</span>
                        Settings
                    </button>

                    <div class="score">
                        <div id="playerGold" class="score-line player"></div>
                        <div
                            id="computerGold"
                            class="score-line computer"
                        ></div>
                    </div>

                    <!-- FIXME: statusBar/muteButton UI is placeholder; implement mute UX + wiring -->
                    <div id="statusBar" class="status-bar">
                        <div id="muteButton" class="mute-button"></div>
                    </div>
                </div>
            </aside>

            <main id="gameArea">
                <canvas id="gameCanvas"></canvas>
                <div id="gameOverlay" aria-live="polite"></div>
            </main>
        </div>

        <script type="module" src="main.js?v=__APP_VERSION__"></script>
    </body>
</html>
